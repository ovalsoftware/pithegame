---
layout: default
---
<section class="page-head">
  <div class="container">
    {% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.h1 | default: page.title }}</h1>
    {% if page.lead %}<p>{{ page.lead }}</p>{% endif %}
  </div>
</section>
<section class="section">
  <div class="container prose">
    {{ content }}
  </div>
</section>
